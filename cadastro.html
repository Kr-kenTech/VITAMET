<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaMet - Criar Conta</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="container">

        <div class="imagem">
            <img src="/foto.jpeg" alt="Imagem VitaMed">
        </div>

        <div class="cadastro-box">

            <h1>Criar conta</h1>

            <p>Cadastre-se como tutor</p>

            <input type="text" id="nome" placeholder="Nome completo">

            <input type="text" id="cpf" placeholder="CPF">

            <input type="tel" id="telefone" placeholder="Telefone">

            <input type="email" id="email" placeholder="E-mail">

            <input type="password" id="senha" placeholder="Crie sua senha">

            <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">

            <button onclick="cadastrar()">
                Criar conta
            </button>

            <a href="../login.html" class="voltar">
                ← Voltar para o login
            </a>

            <a href="/index.html" class="inicio">
                ← Voltar para o início
            </a>

        </div>

    </div>

    <script>

        const cpfInput = document.getElementById("cpf");

        // Máscara progressiva do CPF
        cpfInput.addEventListener("input", () => {
            let valor = cpfInput.value.replace(/\D/g, "");
            valor = valor.substring(0, 11);

            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            cpfInput.value = valor;
        });

        // Função para calcular os dígitos verificadores
        function validarCPF(cpfValor) {
            cpfValor = cpfValor.replace(/\D/g, "");

            if (cpfValor.length !== 11) return false;
            if (/^(\d)\1+$/.test(cpfValor)) return false;

            let soma = 0;
            let resto;

            for (let i = 1; i <= 9; i++) {
                soma += parseInt(cpfValor.substring(i - 1, i)) * (11 - i);
            }

            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpfValor.substring(9, 10))) return false;

            soma = 0;

            for (let i = 1; i <= 10; i++) {
                soma += parseInt(cpfValor.substring(i - 1, i)) * (12 - i);
            }

            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpfValor.substring(10, 11))) return false;

            return true;
        }

        // Feedback visual ao sair do campo (blur)
        cpfInput.addEventListener("blur", () => {
            if (cpfInput.value.trim() === "") {
                cpfInput.style.border = "";
                return;
            }

            if (validarCPF(cpfInput.value)) {
                cpfInput.style.border = "2px solid green";
            } else {
                cpfInput.style.border = "2px solid red";
                alert("CPF inválido!");
            }
        });


        async function cadastrar() {
            let nome = document.getElementById("nome").value;
            let cpf = document.getElementById("cpf").value;
            let telefone = document.getElementById("telefone").value;
            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;
            let confirmarSenha = document.getElementById("confirmarSenha").value;

            if (
                nome === "" ||
                cpf === "" ||
                telefone === "" ||
                email === "" ||
                senha === "" ||
                confirmarSenha === ""
            ) {
                alert("Preencha todos os campos!");
                return;
            }

            if (senha.length < 6) {
                alert("A senha deve ter pelo menos 6 caracteres!");
                return;
            }

            if (senha !== confirmarSenha) {
                alert("As senhas não são iguais!");
                return;
            }

            try {
                let resposta = await fetch('/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, cpf, telefone, email, senha })
                });

                let resultado = await resposta.json();

                if (resposta.ok) {
                    alert(resultado.mensagem);
                    window.location.href = "../login.html";
                } else {
                    alert(resultado.erro || "Erro ao realizar cadastro.");
                }
            } catch (error) {
                alert("Erro de conexão com o servidor.");
            }
        }
    </script>
</body>

</html>
