<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaMed - Recuperar Senha</title>
    <link rel="stylesheet" href="esqueci-senha.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="container">
    <div class="imagem">
        <img src="foto.jpeg" alt="Imagem VitaMed">
    </div>

    <div class="cadastro-box">
        <h1>Recuperar senha</h1>
        <p>Digite o e-mail cadastrado para recuperar sua senha.</p>

        <input type="email" id="email" placeholder="Digite seu e-mail">

        <button onclick="recuperar()">Recuperar senha</button>

        <a href="login.html" class="voltar">← Voltar para o login</a>
        <a href="index.html" class="inicio">← Voltar para o início</a>
    </div>
</div>

<script>
async function recuperar() {
    const email = document.getElementById("email").value.trim().toLowerCase();

    if (!email) {
        alert("Digite seu e-mail!");
        return;
    }

    try {
        const res = await fetch('/recuperar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.erro || "E-mail não encontrado!");
            return;
        }

        // Guarda o e-mail temporariamente para a próxima página
        sessionStorage.setItem('email_recuperacao', email);

        alert("E-mail encontrado! Agora você pode redefinir sua senha.");
        window.location.href = "redefinir-senha.html";

    } catch (erro) {
        console.error(erro);
        alert("Erro de comunicação com o servidor.");
    }
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado!', reg.scope))
            .catch(err => console.error('Erro no Service Worker:', err));
    });
}
</script>
</body>
</html>
