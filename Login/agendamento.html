<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="agendamento.css">
    <title>Agendamento | VITAMED</title>
</head>

<body>

    <main class="appointment">

        <div class="appointment-content">

            <div class="logo">
                VITA<span>MED</span>
            </div>

            <span class="section-subtitle">
                AGENDAMENTO
            </span>

            <h2>
                Agende uma consulta
            </h2>

            <p>
                Selecione seu pet e escolha o serviço,
                a data e o horário da consulta.
            </p>

            <form onsubmit="confirmarAgendamento(event)">

                <div class="form-group">

                    <label for="pet">
                        Seu pet
                    </label>

                    <select id="pet" name="pet" required>

                        <option value="" selected disabled>
                            Selecione seu pet
                        </option>

                        <option value="pet1">
                            Meu pet
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="servico">
                        Serviço desejado
                    </label>

                    <select id="servico" name="servico" required>

                        <option value="" selected disabled>
                            Selecione um serviço
                        </option>

                        <option value="consulta">
                            Consulta veterinária
                        </option>

                        <option value="vacinacao">
                            Vacinação
                        </option>

                        <option value="exames">
                            Exames
                        </option>

                        <option value="higiene">
                            Higiene e cuidados
                        </option>

                    </select>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="data">
                            Data
                        </label>

                        <input
                            type="date"
                            id="data"
                            name="data"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="horario">
                            Horário
                        </label>

                        <input
                            type="time"
                            id="horario"
                            name="horario"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="4"
                        maxlength="300"
                        placeholder="Informe alguma observação sobre o seu pet"
                    ></textarea>

                </div>

                <button
                    type="submit"
                    class="btn-agendar"
                >
                    Confirmar agendamento
                </button>

            </form>

            <a href="tutor.html" class="voltar">
                ← Voltar para Meus Pets
            </a>

        </div>

    </main>

    <script>

        function confirmarAgendamento(event) {

            event.preventDefault();

            const pet = document.getElementById("pet").value;
            const servico = document.getElementById("servico").value;
            const data = document.getElementById("data").value;
            const horario = document.getElementById("horario").value;

            if (!pet || !servico || !data || !horario) {
                alert("Preencha todos os campos obrigatórios.");
                return;
            }

            alert("Agendamento realizado com sucesso!");

            event.target.reset();

        }

    </script>

</body>

</html>
