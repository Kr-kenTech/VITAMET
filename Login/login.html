<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaMed - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">

        <div class="imagem">
            <img src="/foto.jpeg" alt="Imagem VitaMed">
        </div>

        <div class="login-box">

            <h1>Login</h1>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >

            <a href="esqueci-senha.html" class="esqueci">
                Esqueci minha senha
            </a>

            <button onclick="entrar()">
                Entrar
            </button>

            <p>Não possui uma conta?</p>

            <a href="Cadastro/cadastro.html" class="criar">
                Criar conta de tutor
            </a>

            <a href="/index.html" class="inicio">
                ← Voltar para o início
            </a>

        </div>

    </div>

    <script>
        async function entrar() {
            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;

            if (!email || !senha) {
                alert("Preencha o e-mail e a senha!");
                return;
            }

            try {
                let resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                let resultado = await resposta.json();

                if (resposta.ok) {
                    alert(resultado.mensagem);
                    sessionStorage.setItem("usuario", JSON.stringify(resultado.usuario));
                    window.location.href = "/tutor.html";
                } else {
                    alert(resultado.erro || "E-mail ou senha incorretos!");
                }
            } catch (error) {
                alert("Erro de conexão com o servidor.");
            }
        }
    </script>

</body>

</html>
