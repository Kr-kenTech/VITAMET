<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaMed - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div class="container">

        <div class="imagem">
            <img src="/foto.jpeg" alt="Imagem VitaMed">
        </div>

        <div class="login-box">

            <h1>Login</h1>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >

            <a href="esqueci-senha.html" class="esqueci">
                Esqueci minha senha
            </a>

            <button onclick="entrar()">
                Entrar
            </button>

            <p>Não possui uma conta?</p>

            <a href="/cadastro.html" class="criar">
                Criar conta de tutor
            </a>

            <a href="/index.html" class="inicio">
                 Voltar para o início
            </a>

        </div>

    </div>

    <script>
    async function entrar() {
        let email = document.getElementById("email").value.trim();
        let senha = document.getElementById("senha").value;

        if (!email || !senha) {
            alert("Preencha o e-mail e a senha!");
            return;
        }

        try {
            let resposta = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            let resultado = await resposta.json();

            if (resposta.ok) {
                console.log(resultado.mensagem);
                
                // 1. SALVA OS DADOS DO USUÁRIO NO LOCALSTORAGE (Isto corrige o erro do perfil!)
                // (Verificamos se o backend mandou 'usuario' ou 'tutor' para evitar erros)
                const dadosUsuario = resultado.usuario || resultado.tutor;
                if (dadosUsuario) {
                    localStorage.setItem("tutor", JSON.stringify(dadosUsuario));
                }

                // 2. Pega o ID que veio do banco e direciona para o painel do tutor mantendo o ID na URL
                const usuarioId = dadosUsuario ? dadosUsuario.id : "";
                window.location.href = `user/tutor.html${usuarioId ? '?id=' + usuarioId : ''}`;
            } else {
                alert(resultado.erro || "E-mail ou senha incorretos!");
            }
        } catch (error) {
            console.error("Erro no login:", error);
            alert("Erro de conexão com o servidor.");
        }
    }
    if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => {
        console.log('Service Worker do VitaMet registrado com sucesso!', reg.scope);
      })
      .catch(err => {
        console.error('Erro ao registrar o Service Worker:', err);
      });
  });
}
</script>

</body>

</html>
